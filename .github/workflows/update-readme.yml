name: Update Profile README

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at UTC 08:00 (Beijing 16:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run update script
        run: python scripts/update_readme.py
        env:
          SOCIALDATAX_API_KEY: ${{ secrets.SOCIALDATAX_API_KEY }}

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff README.md > /tmp/readme_diff.patch
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: auto-update profile README"
          git push

      - name: Send email via Resend
        if: steps.diff.outputs.changed == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request

          diff_text = ""
          try:
              with open("/tmp/readme_diff.patch", encoding="utf-8") as f:
                  diff_text = f.read()
          except Exception:
              diff_text = "(diff not available)"

          # Build readable change summary
          added = [l[1:] for l in diff_text.splitlines() if l.startswith("+") and not l.startswith("+++")]
          removed = [l[1:] for l in diff_text.splitlines() if l.startswith("-") and not l.startswith("---")]

          sections = []
          sections.append(f"Added {len(added)} line(s), removed {len(removed)} line(s).")

          if added:
              sections.append("\n--- Added ---")
              for line in added[:20]:
                  sections.append(f"  + {line.strip()}")
              if len(added) > 20:
                  sections.append(f"  ... and {len(added) - 20} more lines")

          if removed:
              sections.append("\n--- Removed ---")
              for line in removed[:20]:
                  sections.append(f"  - {line.strip()}")
              if len(removed) > 20:
                  sections.append(f"  ... and {len(removed) - 20} more lines")

          body = "\n".join([
              "Your GitHub profile README has been automatically updated.",
              "",
              *sections,
              "",
              "View: https://github.com/yangzhao917",
          ])

          payload = json.dumps({
              "from": "Notify <onboarding@resend.dev>",
              "to": "yzhao3112@gmail.com",
              "subject": "GitHub Profile README Updated",
              "text": body
          }).encode()

          req = urllib.request.Request(
              "https://api.resend.com/emails",
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['RESEND_API_KEY']}",
                  "Content-Type": "application/json"
              }
          )
          resp = urllib.request.urlopen(req)
          print(f"Resend response: {resp.status} {resp.read().decode()}")
          PYEOF
