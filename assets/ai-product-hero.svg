<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#070B18"/><stop offset="0.55" stop-color="#111735"/><stop offset="1" stop-color="#241344"/></linearGradient>
  <radialGradient id="glow1" cx="0" cy="0" r="1" gradientTransform="translate(920 35) rotate(125) scale(420 380)"><stop stop-color="#67E8F9" stop-opacity=".42"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(230 330) rotate(-20) scale(360 260)"><stop stop-color="#A78BFA" stop-opacity=".32"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#9CA3AF" stroke-opacity=".10"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="particleGlow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .p{fill:#B7F7FF;filter:url(#particleGlow)}
    .p2{fill:#C4B5FD;filter:url(#particleGlow)}
    .float{animation:float 7s ease-in-out infinite alternate}
    .pulse{animation:pulse 3.5s ease-in-out infinite}
    @keyframes float{from{transform:translate(0,0);opacity:.25}to{transform:translate(10px,-14px);opacity:.9}}
    @keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
  </style>
</defs>
